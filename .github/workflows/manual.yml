
name: Build JOYROOM Explorer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show project files
        run: |
          echo "Root files:"
          ls -la
          echo "App files:"
          find app -maxdepth 4 -type f 2>/dev/null | head -100

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle wrapper gradlew is missing"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JOYROOM-Explorer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
